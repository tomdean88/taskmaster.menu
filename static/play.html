<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play | Taskmaster</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/play.css">
</head>
<body>
  <main class="phone">
    <div id="status" class="status-bar" hidden>Reconnecting...</div>

    <header class="me-header">
      <img id="me-photo" class="me-thumb" alt="">
      <span id="me-name" class="me-label"></span>
    </header>

    <!-- PLAY TAB -->
    <div id="tab-play">
      <section id="waiting" hidden>
        <h1>Hang tight</h1>
        <p class="hint">The next task will appear here when it starts.</p>
        <p id="up-next" class="up-next"></p>
      </section>

      <section id="performing" hidden>
        <h1 id="perform-title"></h1>
        <p id="perform-hint" class="hint"></p>
      </section>

      <section id="spectating" hidden>
        <h1 id="spectate-title"></h1>
        <p class="hint">Sit back and enjoy this one.</p>
      </section>

      <section id="judging" hidden>
        <h1 id="judge-title"></h1>
        <p id="judge-hint" class="hint"></p>
        <div id="ballot" class="ballot"></div>
        <p id="error" class="error" role="alert"></p>
        <button id="lock-in" class="big-button" type="button">Lock in</button>
        <button id="edit" class="secondary-button" type="button" hidden>Edit my scores</button>
      </section>

      <section id="removed" hidden>
        <h1>You've been removed</h1>
        <p class="hint">Ask the host, or scan the QR code on the TV to join again.</p>
      </section>
    </div>

    <!-- LEADERBOARD TAB -->
    <div id="tab-board" hidden>
      <div id="phone-boards"></div>
    </div>

    <!-- ME TAB -->
    <div id="tab-me" hidden>
      <p id="me-stats" class="me-stats"></p>
      <h2>Your tasks</h2>
      <div id="my-results"></div>
    </div>
  </main>

  <nav class="tabs">
    <button id="play-tab" type="button" class="tab selected" data-tab="play">Play</button>
    <button type="button" class="tab" data-tab="board">Leaderboard</button>
    <button type="button" class="tab" data-tab="me">Me</button>
  </nav>

  <script src="/static/js/play.js"></script>
</body>
</html>
