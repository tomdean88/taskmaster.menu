<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Taskmaster</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <main class="phone">
    <section id="login-section" hidden>
      <h1>Admin</h1>
      <form id="login-form">
        <label class="label" for="password">Password</label>
        <input id="password" class="text-input" type="password" autocomplete="current-password">
        <p id="login-error" class="error" role="alert"></p>
        <button class="big-button" type="submit">Log in</button>
      </form>
    </section>

    <section id="panel-section" hidden>
      <div id="status" class="status-bar" hidden>Reconnecting...</div>
      <p id="error" class="error" role="alert"></p>

      <h2>TV screen</h2>
      <div class="choice-row three">
        <button type="button" class="choice" data-mode="lobby">Lobby</button>
        <button type="button" class="choice" data-mode="game">Game</button>
        <button type="button" class="choice" data-mode="results">Results</button>
      </div>

      <h2>Tasks</h2>
      <form id="task-form" class="stack">
        <input id="task-title" class="text-input" maxlength="80" placeholder="New task title" autocomplete="off">
        <select id="task-group" class="text-input"></select>
        <button class="big-button" type="submit">Add task</button>
      </form>
      <div id="tasks" class="list"></div>

      <details id="completed-wrap" class="completed" hidden>
        <summary id="completed-summary">Completed</summary>
        <div id="completed-tasks" class="list"></div>
      </details>

      <h2>Players</h2>
      <div id="players" class="list"></div>

      <h2>Groups</h2>
      <div id="groups" class="list"></div>

      <button id="logout" type="button" class="secondary-button">Log out</button>
    </section>
  </main>
  <script src="/static/js/admin.js"></script>
</body>
</html>
