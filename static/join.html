<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join | Taskmaster</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/base.css">
</head>
<body>
  <main class="phone">
    <section id="join-section">
      <h1>Join the game</h1>
      <form id="join-form">
        <label class="label" for="name">Your name</label>
        <input id="name" class="text-input" maxlength="24" autocomplete="off">

        <p class="label">Your group</p>
        <div id="groups" class="choice-row"></div>

        <p class="label">Your photo</p>
        <div id="photo-picker">
          <label for="photo" class="photo-picker">
            <span>Tap to take a selfie</span>
          </label>
          <label for="photo-library" class="secondary-button">Choose from photos</label>
        </div>

        <div id="photo-editor" class="photo-editor" hidden>
          <canvas id="photo-canvas" class="photo-canvas"></canvas>
          <p class="hint">Drag to position. Slide to zoom.</p>
          <input id="zoom" class="zoom" type="range" min="1" max="3" step="0.01" value="1">
          <div class="choice-row editor-actions">
            <label for="photo" class="secondary-button">Retake</label>
            <label for="photo-library" class="secondary-button">Choose another</label>
          </div>
        </div>

        <!-- The two real file inputs. Labels above open them. -->
        <input id="photo" class="visually-hidden" type="file" accept="image/*" capture="user">
        <input id="photo-library" class="visually-hidden" type="file" accept="image/*">

        <p id="error" class="error" role="alert"></p>
        <button id="submit" type="submit" class="big-button">Join</button>
      </form>
    </section>

  </main>
  <script src="/static/js/join.js"></script>
</body>
</html>
